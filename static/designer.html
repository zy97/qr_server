<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>标签模板设计器</title>
<script>window.autoConnect = false;</script>
<script src="/designer/vendor/jquery.min.js"></script>
<script src="/designer/vendor/JsBarcode.all.min.js"></script>
<script src="/designer/vendor/bwip-js-min.js"></script>
<script>window["bwip-js"] = window.bwipjs;</script>
<script src="/designer/vendor/socket.io.min.js"></script>
<script src="/designer/vendor/jspdf.umd.min.js"></script>
<script src="/designer/vendor/html2canvas.min.js"></script>
<script src="/designer/vendor/canvg.umd.js"></script>
<script src="/designer/vendor/vue-plugin-hiprint.js"></script>
<style id="designer-ui-style">
  html, body { margin: 0; height: 100%; font-family: "Microsoft YaHei UI", sans-serif; }
  #toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #2d3a4a; color: #fff; }
  #toolbar button { padding: 6px 18px; font-size: 14px; cursor: pointer; border: 0; border-radius: 4px; background: #4a90d9; color: #fff; }
  #toolbar button:hover { background: #357ab8; }
  #status { margin-left: auto; font-size: 13px; }
  #main { display: flex; height: calc(100% - 45px); }
  #palette { width: 160px; border-right: 1px solid #ccc; overflow-y: auto; padding: 8px; background: #f7f7f7; }
  #palette .group-title { font-size: 12px; color: #888; margin: 8px 0 4px; }
  .ep-draggable-item { padding: 6px 8px; margin-bottom: 4px; background: #fff; border: 1px solid #d0d0d0; border-radius: 4px; cursor: grab; font-size: 13px; }
  .ep-draggable-item:hover { border-color: #4a90d9; }
  #canvas-wrap { flex: 1; overflow: auto; padding: 20px; background: #e8e8e8; }
  #settings { width: 260px; border-left: 1px solid #ccc; overflow-y: auto; background: #fafafa; }
  #preview-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 99; }
  #preview-box { display: flex; gap: 16px; position: absolute; top: 5%; left: 50%; transform: translateX(-50%); background: #fff; padding: 20px; border-radius: 6px; }
  #preview-close { margin-top: 12px; }
</style>
</head>
<body>
<div id="toolbar">
  <strong>标签模板设计器</strong><span id="tpl-name" style="font-size:13px;color:#9fc3e8"></span><a href="/templates" style="color:#9fc3e8;font-size:13px">模板管理</a>
  <button id="btn-save">保存模板</button>
  <button id="btn-preview">预览（示例数据）</button>
  <label style="font-size:13px">面板宽 <input id="panel-w" type="number" step="0.1" min="10" style="width:60px"> mm</label>
  <label style="font-size:13px">高 <input id="panel-h" type="number" step="0.1" min="10" style="width:60px"> mm</label>
  <button id="btn-panel">应用面板尺寸</button>
  <span id="status"></span>
</div>
<div id="main">
  <div id="palette"></div>
  <div id="canvas-wrap"><div id="design-canvas"></div></div>
  <div id="settings"><div id="PrintElementOptionSetting"></div></div>
</div>
<div id="preview-mask">
  <div id="preview-box">
    <div>
      <div style="font-size:13px;margin-bottom:6px">预览数据（POST /label?print=false，qr_string 分段：物料编码|批次号|订单号|数量|供应商|日期|箱号）：</div>
      <textarea id="preview-json" style="width:380px;height:280px;font-family:Consolas,monospace;font-size:12px"></textarea>
      <div id="preview-fields" style="font-size:12px;color:#888;margin-top:6px;max-width:380px"></div>
      <div style="margin-top:8px">
        <button id="preview-render">渲染</button>
        <button id="preview-close">关闭</button>
        <span id="preview-status" style="font-size:12px;color:#c00;margin-left:8px"></span>
      </div>
    </div>
    <div style="max-width:55vw;overflow:auto"><img id="preview-img" style="border:1px solid #ccc;background:#fff;display:none" alt=""></div>
  </div>
</div>
<script>
// 内置字段清单（新模板的默认值）。每个模板的字段列表存于模板 JSON 的 fields 键，
// 支持在设计器里增删改——请求数据不同的模板可以自己控制字段
const DEFAULT_FIELDS = [
  { name: 'part_no',       title: '零件号' },
  { name: 'material_no',   title: '物料编码' },
  { name: 'material_name', title: '物料名称' },
  { name: 'box_no',        title: '箱号' },
  { name: 'order_no',      title: '生成订单号' },
  { name: 'count',         title: '数量' },
  { name: 'lot_no',        title: '批次号' },
  { name: 'date',          title: '生产日期' },
  { name: 'customer_name', title: '客户名称' },
];

// 当前模板的字段列表（加载时从模板 JSON 读取，未保存过则为内置默认）
let templateFields = DEFAULT_FIELDS.map(f => ({ ...f }));

function fieldTypeConfig(f) {
  return {
    tid: 'labelModule.' + f.name,
    title: f.title,
    field: f.name,
    type: 'text',
    options: { width: 120, height: 24, fontSize: 10.5, fontWeight: '700', textAlign: 'center', hideTitle: true, testData: '{{ ' + f.name + ' }}' }
  };
}

function labelProvider() {}
labelProvider.prototype.addElementTypes = function (context) {
  const fieldEls = templateFields.map(fieldTypeConfig);
  context.addPrintElementTypes('labelModule', [
    new hiprint.PrintElementTypeGroup('标签字段', fieldEls),
    new hiprint.PrintElementTypeGroup('基础元素', [
      { tid: 'labelModule.qrCode', title: '二维码', type: 'image', field: 'qr_code', options: { width: 80, height: 80 } },
      { tid: 'labelModule.text',  title: '固定文本', type: 'text', data: '文本', options: { width: 80, height: 24, fontSize: 10.5, fontWeight: '700' } },
      { tid: 'labelModule.image', title: '图片', type: 'image', data: '', options: { width: 60, height: 40 } },
      { tid: 'labelModule.hline', title: '横线', type: 'hline', options: { width: 120 } },
      { tid: 'labelModule.vline', title: '竖线', type: 'vline', options: { height: 120 } },
      { tid: 'labelModule.rect',  title: '矩形', type: 'rect', options: { width: 120, height: 40 } },
    ]),
  ]);
};

var hiprintTemplate = null;

function setStatus(msg, isError) {
  $('#status').text(msg).css('color', isError ? '#ff9d9d' : '#9de69d');
}

function fieldPaletteItem(f) {
  const $item = $('<div class="ep-draggable-item"></div>').attr('tid', 'labelModule.' + f.name)
    .append($('<span class="field-label"></span>').text(f.title + '（' + f.name + '）'));
  const $actions = $('<span style="float:right"></span>');
  // 注意用 mousedown 拦截：hidraggable 会在拖拽开始时吞掉 click/dblclick
  const mkBtn = (text, title, color) => $('<span style="cursor:pointer;padding:0 3px"></span>')
    .text(text).css('color', color).attr('title', title);
  mkBtn('✎', '改显示名', '#4a90d9').on('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    const title = prompt('字段显示名：', f.title);
    if (title && title.trim()) {
      f.title = title.trim();
      $item.find('.field-label').text(f.title + '（' + f.name + '）');
    }
  }).appendTo($actions);
  mkBtn('×', '删除', '#c00').on('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    if (confirm('从字段列表移除「' + f.title + '」？（画布上已有元素不受影响）')) {
      templateFields = templateFields.filter(x => x.name !== f.name);
      $item.remove();
    }
  }).appendTo($actions);
  $item.append($actions);
  return $item;
}

function addField() {
  const name = $('#new-field-name').val().trim();
  const title = $('#new-field-title').val().trim() || name;
  if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
    setStatus('字段名只能包含字母、数字、下划线', true);
    return;
  }
  if (templateFields.some(f => f.name === name)) {
    setStatus('字段名已存在: ' + name, true);
    return;
  }
  const f = { name, title };
  templateFields.push(f);
  // 动态注册元素类型（追加一个单字段 provider 再 init 一次）并加入拖拽面板
  const provider = function () {};
  provider.prototype.addElementTypes = function (context) {
    context.addPrintElementTypes('labelModule', [
      new hiprint.PrintElementTypeGroup('标签字段', [fieldTypeConfig(f)])
    ]);
  };
  hiprint.init({ providers: [new provider()] });
  const $item = fieldPaletteItem(f);
  $('#field-items').append($item);
  hiprint.PrintElementTypeManager.buildByHtml($item);
  $('#new-field-name, #new-field-title').val('');
  setStatus('已添加字段 ' + name + '（保存模板后生效）');
}

function buildPalette() {
  const groups = [
    { title: '标签字段', items: null },
    { title: '基础元素', items: [
      { tid: 'labelModule.qrCode', title: '二维码' },
      { tid: 'labelModule.text', title: '固定文本' },
      { tid: 'labelModule.image', title: '图片' },
      { tid: 'labelModule.hline', title: '横线' },
      { tid: 'labelModule.vline', title: '竖线' },
      { tid: 'labelModule.rect', title: '矩形' },
    ]},
  ];
  const $palette = $('#palette').empty();
  groups.forEach(g => {
    $palette.append($('<div class="group-title"></div>').text(g.title));
    if (g.title === '标签字段') {
      $palette.append($('<div id="field-items"></div>'));
      templateFields.forEach(f => $('#field-items').append(fieldPaletteItem(f)));
      $palette.append($(
        '<div style="margin-top:6px;border-top:1px dashed #ccc;padding-top:6px">' +
        '<input id="new-field-name" placeholder="字段名 如 batch" style="width:100%;box-sizing:border-box;margin-bottom:4px;font-size:12px">' +
        '<input id="new-field-title" placeholder="显示名（可空）" style="width:100%;box-sizing:border-box;margin-bottom:4px;font-size:12px">' +
        '<button id="btn-add-field" style="width:100%;font-size:12px;cursor:pointer">添加字段</button>' +
        '</div>'
      ));
      $('#btn-add-field').on('click', addField);
      return;
    }
    g.items.forEach(item => {
      $palette.append($('<div class="ep-draggable-item"></div>').attr('tid', item.tid).text(item.title));
    });
  });
  $palette.append($('<div style="padding:8px 4px;font-size:12px;color:#888;line-height:1.6"></div>')
    .text('提示：固定文本内容或字段名里都可直接写占位符表达式，如 {{ count }}个，渲染时会替换成 100个。'));
}

// 画布上字段元素显示 {{ 字段名 }} 占位符，直观看清绑定关系；
// testData 只影响设计态显示，保存后的渲染 HTML 始终由占位符数据生成，不受影响
function applyFieldPlaceholders(designJson) {
  ((designJson && designJson.panels) || []).forEach(p => (p.printElements || []).forEach(el => {
    const o = el.options || {};
    if (!o.field) return;
    if (o.field.includes('{{')) o.testData = o.field;
    else if (!o.testData) o.testData = '{{ ' + o.field + ' }}';
  }));
  return designJson;
}


// 按元素是否绑定字段裁剪右侧参数面板：
// 固定文本不显示「字段名/测试数据」，字段元素不显示「标题」
// （面板是按 text 类原型共享构建的，在原型上按实例过滤，新拖入的元素同样生效）
function customizeOptionPanels() {
  const panel = hiprintTemplate.getPanel(0);
  const textEl = (panel.printElements || []).find(e => e.printElementType && e.printElementType.type === 'text');
  if (!textEl) return;
  const proto = Object.getPrototypeOf(textEl);
  if (proto.__optionPanelPatched) return;
  proto.__optionPanelPatched = true;
  const original = proto.getConfigOptions;
  proto.getConfigOptions = function () {
    const cfg = original.call(this);
    const hasField = !!((this.options && this.options.field) || (this.printElementType && this.printElementType.field));
    const drop = hasField ? ['title'] : ['field', 'testData'];
    return {
      ...cfg,
      tabs: (cfg.tabs || []).map(tab => ({
        ...tab,
        options: (tab.options || []).filter(o => !drop.includes(o.name)),
      })),
    };
  };
}

function initDesigner(templateJson) {
  hiprint.init({ providers: [new labelProvider()] });
  buildPalette();
  hiprint.PrintElementTypeManager.buildByHtml($('.ep-draggable-item'));
  hiprintTemplate = new hiprint.PrintTemplate({
    template: templateJson,
    settingContainer: '#PrintElementOptionSetting',
  });
  $('#design-canvas').empty();
  hiprintTemplate.design('#design-canvas');
  syncPanelSizeInputs();
  customizeOptionPanels();
}

// 占位符数据以画布上元素实际使用的字段为准（与字段面板的增删无关）：
// 普通字段生成 {{ field }}；字段名直接写占位符表达式（如 {{ count }}个）的原样输出，由 Tera 替换
function placeholderData(templateJson) {
  const data = { qr_code: '{{ qr_code }}' };
  ((templateJson && templateJson.panels) || []).forEach(p => (p.printElements || []).forEach(el => {
    const f = el.options && el.options.field;
    if (f) data[f] = f.includes('{{') ? f : '{{ ' + f + ' }}';
  }));
  return data;
}

// 预览直接调 /label 走真实渲染链路；请求体即 LabelInfo，用户可自由编辑，
// 上次编辑内容存 localStorage
const PREVIEW_STORAGE_KEY = 'qr_designer_preview_json';
const DEFAULT_PREVIEW_DATA = {
  kind: 0,
  customer_name: '某某客户有限公司',
  part_no: 'W4515654841155',
  material_name: 'LQFC-0',
  qr_string: '479927000140|240514A634|ASN240515000367|100|V001|2024-08-21|900001',
  is_return: false,
};

// 提取当前模板实际用到的字段（字段绑定 + 文本内容里的 {{ }} 表达式）
function collectUsedFields() {
  let json = hiprintTemplate.getJson();
  if (typeof json === 'string') json = JSON.parse(json);
  const found = [];
  ((json && json.panels) || []).forEach(p => (p.printElements || []).forEach(el => {
    const o = el.options || {};
    if (o.field && !found.includes(o.field)) found.push(o.field);
    if (o.title) (String(o.title).match(/\{\{[^}]+\}\}/g) || [])
      .forEach(m => { if (!found.includes(m)) found.push(m); });
  }));
  return found;
}

async function renderPreview() {
  const $status = $('#preview-status').css('color', '#c00');
  let label;
  try {
    label = JSON.parse($('#preview-json').val());
  } catch (e) {
    $status.text('JSON 格式错误: ' + e.message);
    return;
  }
  localStorage.setItem(PREVIEW_STORAGE_KEY, $('#preview-json').val());
  $status.css('color', '#888').text('渲染中…');
  try {
    const resp = await fetch('/label?print=false', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify([label]),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + await resp.text());
    const blob = await resp.blob();
    $('#preview-img').attr('src', URL.createObjectURL(blob)).show();
    $status.text('');
  } catch (e) {
    $status.css('color', '#c00').text('渲染失败: ' + e.message);
  }
}

// hiprint 运行时注入到 head 的样式（排除本页面自身的 UI 样式），随模板一起保存，
// 保证 Tera 渲染出的 HTML 脱离 hiprint 也能正常显示。
// 保存的模板只用于展示：剔除设计态规则（拖拽手柄/虚线框/右键菜单/参数面板等）和打印媒体查询
const DESIGN_CSS_RE = /\.design|resize-panel|hicontextmenu|hiprint-option|prop-tab|hi-pretty|hidraggable|hiprint-combo|select2|daterangepicker/;
function collectHiprintCss() {
  const raw = $('head style').not('#designer-ui-style').map((i, el) => el.textContent).get().join('\n');
  const rules = [];
  let depth = 0, start = 0;
  for (let i = 0; i < raw.length; i++) {
    if (raw[i] === '{') depth++;
    else if (raw[i] === '}') {
      depth--;
      if (depth === 0) { rules.push(raw.slice(start, i + 1)); start = i + 1; }
    }
  }
  return rules.filter(rule => {
    const selector = rule.slice(0, rule.indexOf('{')).trim();
    if (selector.startsWith('@media')) return false;
    return !DESIGN_CSS_RE.test(selector);
  }).join('\n');
}

function buildTemplateHtml() {
  let json = hiprintTemplate.getJson();
  if (typeof json === 'string') json = JSON.parse(json);
  json.fields = templateFields;
  const $html = hiprintTemplate.getHtml(placeholderData(json));
  const $wrap = $('<div>').append($html);
  // 纯展示模板：去掉可聚焦属性（点击会出现焦点高亮框）和浏览器打印用的 @page 块
  $wrap.find('[tabindex]').removeAttr('tabindex');
  $wrap.find('style[printstyle]').remove();
  const panelHtml = $wrap.html();
  const panel = (json.panels && json.panels[0]) || {};
  const width = panel.width || 150;
  const height = panel.height || 80;
  const doc = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n'
    + '<style>\nhtml, body { margin: 0; padding: 0; }\n'
    + 'body { font-family: "Microsoft YaHei UI", sans-serif; font-weight: bold; }\n'
    + '#app *:focus { outline: none !important; }\n'
    + '#app { position: relative; width: ' + width + 'mm; height: ' + height + 'mm; overflow: hidden; }\n'
    + '</style>\n<style>\n' + collectHiprintCss() + '\n</style>\n</head>\n<body>\n'
    + '<div id="app">' + panelHtml + '</div>\n</body>\n</html>';
  return { json, html: doc };
}

$('#btn-save').on('click', async () => {
  try {
    const payload = buildTemplateHtml();
    const resp = await fetch('/api/templates/' + templateId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + await resp.text());
    setStatus('已保存 ' + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus('保存失败: ' + e.message, true);
  }
});

function syncPanelSizeInputs() {
  let json = hiprintTemplate.getJson();
  if (typeof json === 'string') json = JSON.parse(json);
  const p = (json.panels && json.panels[0]) || {};
  $('#panel-w').val(p.width || 150);
  $('#panel-h').val(p.height || 70);
}

$('#btn-panel').on('click', () => {
  const w = parseFloat($('#panel-w').val());
  const h = parseFloat($('#panel-h').val());
  if (!(w > 0 && h > 0)) { setStatus('面板尺寸无效', true); return; }
  // hiprint 面板 resize：paperType 传 null 表示自定义尺寸（单位 mm）
  hiprintTemplate.getPanel(0).resize(null, w, h);
  setStatus('面板已调整为 ' + w + 'mm × ' + h + 'mm，保存后生效');
});
$('#btn-preview').on('click', () => {
  $('#preview-json').val(localStorage.getItem(PREVIEW_STORAGE_KEY) || JSON.stringify(DEFAULT_PREVIEW_DATA, null, 2));
  $('#preview-fields').text('当前模板使用字段：' + (collectUsedFields().join('、') || '（无）'));
  $('#preview-mask').fadeIn(100);
  renderPreview();
});
$('#preview-render').on('click', renderPreview);
$('#preview-close').on('click', () => $('#preview-mask').fadeOut(100));
$('#preview-mask').on('click', e => {
  if (e.target.id === 'preview-mask') $('#preview-mask').fadeOut(100);
});

const templateId = new URLSearchParams(location.search).get('id') || 'default';

$(async () => {
  try {
    const resp = await fetch('/api/templates/' + templateId);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const record = await resp.json();
    $('#tpl-name').text('— ' + record.name + (record.is_default ? '（默认）' : ''));
    if (Array.isArray(record.design_json.fields) && record.design_json.fields.length) {
      templateFields = record.design_json.fields;
    }
    initDesigner(applyFieldPlaceholders(record.design_json));
    setStatus('已加载模板');
  } catch (e) {
    initDesigner({ panels: [{ index: 0, width: 150, height: 70, paperHeader: 0, paperFooter: 198.4, paperNumberDisabled: true, printElements: [] }] });
    setStatus('模板加载失败，从空白标签开始', true);
  }
});
</script>
</body>
</html>
