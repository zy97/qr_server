<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>标签模板设计器</title>
<script>window.autoConnect = false;</script>
<script src="/designer/vendor/jquery.min.js"></script>
<script src="/designer/vendor/JsBarcode.all.min.js"></script>
<script src="/designer/vendor/bwip-js-min.js"></script>
<script>window["bwip-js"] = window.bwipjs;</script>
<script src="/designer/vendor/socket.io.min.js"></script>
<script src="/designer/vendor/jspdf.umd.min.js"></script>
<script src="/designer/vendor/html2canvas.min.js"></script>
<script src="/designer/vendor/canvg.umd.js"></script>

<style id="designer-ui-style">
  html, body { margin: 0; height: 100%; font-family: "Microsoft YaHei UI", sans-serif; }
  #toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #2d3a4a; color: #fff; }
  #toolbar button { padding: 6px 18px; font-size: 14px; cursor: pointer; border: 0; border-radius: 4px; background: #4a90d9; color: #fff; }
  #toolbar button:hover { background: #357ab8; }
  #status { margin-left: auto; font-size: 13px; }
  #main { display: flex; height: calc(100% - 45px - 48px); }
  body.hide-ruler .hiprint_rul_wrapper { display: none; }
  body.hide-sizebox .size-box { display: none !important; }
  /* 虚线框开关：隐藏字段标记虚线 + hiprint 设计模式给所有元素加的虚线边框 */
  body.hide-outline #design-canvas .field-bound > .hiprint-printElement-text-content,
  body.hide-outline #design-canvas .field-bound > .hiprint-printElement-image-content { outline: none; }
  body.hide-outline #design-canvas .hiprint-printPaper.design { border: none; }
  body.hide-outline #design-canvas .design .hiprint-printElement-text-content,
  body.hide-outline #design-canvas .design .hiprint-printElement-longText-content,
  body.hide-outline #design-canvas .design .hiprint-printElement-html-content,
  body.hide-outline #design-canvas .design .hiprint-printElement-image-content,
  body.hide-outline #design-canvas .design .hiprint-printElement-table-content { border: none !important; }
  #field-bar { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; border-top: 1px solid #ccc; background: #f7f7f7; box-sizing: border-box; }
  /* 字段绑定元素：文字蓝色 + 虚线框（仅设计器内区分类型，不进渲染产物） */
  #design-canvas .field-bound > .hiprint-printElement-text-content,
  #design-canvas .field-bound > .hiprint-printElement-image-content { color: #1a66cc; outline: 1px dashed rgba(74,144,217,.7); outline-offset: -1px; }
  #field-bar input { padding: 6px 8px; font-size: 13px; width: 220px; }
  #field-bar button { padding: 6px 16px; font-size: 13px; cursor: pointer; }
  #palette { width: 160px; border-right: 1px solid #ccc; overflow-y: auto; padding: 8px; background: #f7f7f7; }
  #palette .group-title { font-size: 12px; color: #888; margin: 8px 0 4px; }
  .ep-draggable-item { padding: 6px 8px; margin-bottom: 4px; background: #fff; border: 1px solid #d0d0d0; border-radius: 4px; cursor: grab; font-size: 13px; }
  .ep-draggable-item:hover { border-color: #4a90d9; }
  #canvas-wrap { flex: 1; overflow: auto; padding: 20px; background: #e8e8e8; }
  #settings { width: 260px; border-left: 1px solid #ccc; overflow-y: auto; background: #fafafa; }
  #preview-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 99; }
  #preview-box { display: flex; gap: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 20px; border-radius: 6px; width: 1380px; height: 760px; box-sizing: border-box; overflow: hidden; }
  #preview-box .preview-result { flex: 1; min-width: 0; overflow: auto; }
  #preview-close { margin-top: 12px; }
</style>
</head>
<body>
<div id="toolbar">
  <strong>标签模板设计器</strong><span id="tpl-name" style="font-size:13px;color:#9fc3e8"></span><a href="/templates" style="color:#9fc3e8;font-size:13px">模板管理</a>
  <button id="btn-save">保存模板</button>
  <button id="btn-preview">预览（示例数据）</button>
  <label style="font-size:13px">面板宽 <input id="panel-w" type="number" step="0.1" min="10" style="width:60px"> mm</label>
  <label style="font-size:13px">高 <input id="panel-h" type="number" step="0.1" min="10" style="width:60px"> mm</label>
  <button id="btn-panel">应用面板尺寸</button>
  <label style="font-size:13px" title="内容与最外层容器之间的间隙（影响渲染图片的外框留白）">边距 <input id="app-padding" type="number" step="0.5" min="0" style="width:50px" value="3"> pt</label>
  <label style="font-size:13px;display:flex;align-items:center;gap:4px" title="编辑文字或保存时，自动把 logo 和公司标题作为一组居中"><input type="checkbox" id="auto-center-header" checked> 表头自动居中</label>
  <label style="font-size:13px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="toggle-ruler" checked> 显示刻度</label>
  <label style="font-size:13px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="toggle-sizebox" checked> 尺寸提示</label>
  <label style="font-size:13px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="toggle-outline" checked> 虚线框</label>
  <span id="hint-toggle" title="语法说明" style="cursor:pointer;color:#9fc3e8;border:1px solid #9fc3e8;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;user-select:none">?</span>
  <span id="status"></span>
</div>
<div id="main">
  <div id="palette"></div>
  <div id="canvas-wrap"><div id="design-canvas"></div></div>
  <div id="settings">
    <div id="PrintElementOptionSetting"></div>
  </div>
</div>
<div id="hint-pop" style="display:none;position:fixed;top:46px;right:12px;z-index:100;background:#fff;border:1px solid #ccc;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.2);padding:12px 14px;font-size:12px;color:#555;line-height:1.8;max-width:520px">
  文本内容或字段名里可直接写表达式：<br>
  <b>{{ count }}个</b> —— 拼接文本，渲染为 100个<br>
  <b>{{ is_return ? "回" : "" }}</b> —— 条件判断<br>
  <b>{{ qr_string | [6] }}</b> —— 按 | 切分取第 6 段（分隔符可自定义）<br>
  <b>{{ order_no@qr }}</b> —— 转二维码；<b>{{ order_no@条形码 }}</b> —— 转一维码
</div>
<div id="field-bar">
  <span style="font-size:13px;font-weight:700">标签字段</span>
  <input id="field-name" placeholder="字段名 如 batch">
  <input id="field-title" placeholder="展示名（可空）">
  <button id="btn-field-save">添加字段</button>
  <button id="btn-field-cancel" style="display:none">取消</button>
</div>
<div id="preview-mask">
  <div id="preview-box">
    <div>
      <div style="font-size:13px;margin-bottom:6px">预览数据（POST /label?print=false&template=当前模板，qr_string 分段：物料编码|批次号|订单号|数量|供应商|日期|箱号）：</div>
      <textarea id="preview-json" style="width:380px;height:280px;font-family:Consolas,monospace;font-size:12px"></textarea>
      <div id="preview-fields" style="font-size:12px;color:#888;margin-top:6px;max-width:380px"></div>
      <div style="margin-top:8px">
        <button id="preview-render">渲染</button>
        <button id="preview-close">关闭</button>
        <span id="preview-status" style="font-size:12px;color:#c00;margin-left:8px"></span>
      </div>
    </div>
    <div class="preview-result"><img id="preview-img" style="border:1px solid #ccc;background:#fff;display:none" alt=""></div>
  </div>
</div>
<script>
// 内置字段清单（新模板的默认值）。每个模板的字段列表存于模板 JSON 的 fields 键，
// 支持在设计器里增删改——请求数据不同的模板可以自己控制字段
const DEFAULT_FIELDS = [
  { name: 'part_no',       title: '零件号' },
  { name: 'material_no',   title: '物料编码' },
  { name: 'material_name', title: '物料名称' },
  { name: 'box_no',        title: '箱号' },
  { name: 'order_no',      title: '生成订单号' },
  { name: 'count',         title: '数量' },
  { name: 'lot_no',        title: '批次号' },
  { name: 'date',          title: '生产日期' },
  { name: 'customer_name', title: '客户名称' },
];

// 当前模板的字段列表（加载时从模板 JSON 读取，未保存过则为内置默认）
let templateFields = DEFAULT_FIELDS.map(f => ({ ...f }));

function fieldTypeConfig(f) {
  return {
    tid: 'labelModule.' + f.name,
    title: f.title,
    field: f.name,
    type: 'text',
    options: { width: 120, height: 24, fontSize: 10.5, fontWeight: '700', textAlign: 'center', hideTitle: true, testData: f.title }
  };
}

function labelProvider() {}
labelProvider.prototype.addElementTypes = function (context) {
  const fieldEls = templateFields.map(fieldTypeConfig);
  context.addPrintElementTypes('labelModule', [
    new hiprint.PrintElementTypeGroup('标签字段', fieldEls),
    new hiprint.PrintElementTypeGroup('基础元素', [
      { tid: 'labelModule.text',  title: '固定文本', type: 'text', data: '文本', options: { width: 80, height: 24, fontSize: 10.5, fontWeight: '700' } },
      { tid: 'labelModule.image', title: '图片', type: 'image', data: '', options: { width: 60, height: 40 } },
      { tid: 'labelModule.hline', title: '横线', type: 'hline', options: { width: 120 } },
      { tid: 'labelModule.vline', title: '竖线', type: 'vline', options: { height: 120 } },
      { tid: 'labelModule.rect',  title: '矩形', type: 'rect', options: { width: 120, height: 40, zIndex: 0 } },
    ]),
  ]);
};

var hiprintTemplate = null;

function setStatus(msg, isError) {
  $('#status').text(msg).css('color', isError ? '#ff9d9d' : '#9de69d');
}

// 字段的展示形式：纯字段名显示为 {{ name }}，表达式原样显示
function displayFieldName(name) {
  return name.includes('{{') ? name : '{{ ' + name + ' }}';
}

function fieldPaletteItem(f) {
  // flex 布局：文本超长省略号，按钮固定右侧不换行
  const $item = $('<div class="ep-draggable-item" style="display:flex;align-items:center;gap:2px"></div>')
    .attr('tid', 'labelModule.' + f.name)
    .append($('<span class="field-label" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>')
      .text(f.title + '（' + displayFieldName(f.name) + '）'));
  const $actions = $('<span style="white-space:nowrap"></span>');
  // 注意用 mousedown 拦截：hidraggable 会在拖拽开始时吞掉 click/dblclick
  const mkBtn = (text, title, color) => $('<span style="cursor:pointer;padding:0 3px"></span>')
    .text(text).css('color', color).attr('title', title);
  mkBtn('✎', '编辑字段', '#4a90d9').on('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    editField(f, $item);
  }).appendTo($actions);
  mkBtn('×', '删除', '#c00').on('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    if (confirm('从字段列表移除「' + f.title + '」？（画布上已有元素不受影响）')) {
      templateFields = templateFields.filter(x => x.name !== f.name);
      $item.remove();
    }
  }).appendTo($actions);
  $item.append($actions);
  return $item;
}

// 追加一个单字段 provider 再 init 一次，完成元素类型注册
function registerFieldType(f) {
  const provider = function () {};
  provider.prototype.addElementTypes = function (context) {
    context.addPrintElementTypes('labelModule', [
      new hiprint.PrintElementTypeGroup('标签字段', [fieldTypeConfig(f)])
    ]);
  };
  hiprint.init({ providers: [new provider()] });
}

// 把画布元素实际使用的字段并入字段列表（加载/保存时调用），
// 例如元素绑定了 {{ qr_string | [0] }}，字段列表里就该有对应项；显示名取元素标题
function syncFieldsFromCanvas(designJson, live) {
  ((designJson && designJson.panels) || []).forEach(p => (p.printElements || []).forEach(el => {
    const o = el.options || {};
    const f = o.field;
    if (!f) return;
    if (templateFields.some(x => x.name === f)) return;
    const field = { name: f, title: o.title || f };
    templateFields.push(field);
    if (live) {
      registerFieldType(field);
      const $item = fieldPaletteItem(field);
      $('#field-items').append($item);
      hiprint.PrintElementTypeManager.buildByHtml($item);
    }
  }));
}
// 字段编辑状态：非空表示正在编辑已有字段（表单回填自该字段）
let editingField = null;

function resetFieldEditor() {
  editingField = null;
  $('#field-name').val('');
  $('#field-title').val('');
  $('#btn-field-save').text('添加字段');
  $('#btn-field-cancel').hide();
}

// 点字段项的 ✎：回填到右侧字段编辑器
function editField(f, $item) {
  editingField = { f, $item };
  $('#field-name').val(f.name);
  $('#field-title').val(f.title);
  $('#btn-field-save').text('保存修改');
  $('#btn-field-cancel').show();
}

// 字段名变化时更新 tid 并注册新类型（画布上已有元素保持原绑定）
function submitFieldEditor() {
  const name = $('#field-name').val().trim();
  const title = $('#field-title').val().trim() || name;
  // 字段名允许纯标识符（如 count）或 {{ }} 表达式（如 {{ qr_string | [0] }}）
  const isIdent = /^[A-Za-z_][A-Za-z0-9_]*$/.test(name);
  const isExpr = /^\{\{[\s\S]+\}\}$/.test(name);
  if (!isIdent && !isExpr) {
    setStatus('字段名需为标识符（字母/数字/下划线）或 {{ }} 表达式', true);
    return;
  }
  if (editingField) {
    const { f, $item } = editingField;
    if (name !== f.name && templateFields.some(x => x.name === name)) {
      setStatus('字段名已存在: ' + name, true);
      return;
    }
    const oldName = f.name;
    const nameChanged = name !== oldName;
    f.name = name;
    f.title = title;
    $item.attr('tid', 'labelModule.' + name);
    $item.find('.field-label').text(f.title + '（' + displayFieldName(f.name) + '）');
    if (nameChanged) {
      registerFieldType(f);
      hiprint.PrintElementTypeManager.buildByHtml($item);
      // 同步画布上绑定旧字段名的元素（含表达式绑定的不动）
      (hiprintTemplate.getPanel(0).printElements || []).forEach(el => {
        if (el.options && el.options.field === oldName) {
          el.options.field = name;
          el.options.testData = title;
          el.options.title = title;
          if (el.printElementType) el.printElementType.title = title;
          if (el.updateDesignViewFromOptions) el.updateDesignViewFromOptions();
        }
      });
    }
    setStatus('字段已更新（保存模板后生效）');
  } else {
    if (templateFields.some(f => f.name === name)) {
      setStatus('字段名已存在: ' + name, true);
      return;
    }
    const f = { name, title };
    templateFields.push(f);
    registerFieldType(f);
    const $item = fieldPaletteItem(f);
    $('#field-items').append($item);
    hiprint.PrintElementTypeManager.buildByHtml($item);
    setStatus('已添加字段 ' + name + '（保存模板后生效）');
  }
  resetFieldEditor();
}

function buildPalette() {
  const groups = [
    { title: '标签字段', items: null },
    { title: '基础元素', items: [
      { tid: 'labelModule.text', title: '固定文本' },
      { tid: 'labelModule.image', title: '图片' },
      { tid: 'labelModule.hline', title: '横线' },
      { tid: 'labelModule.vline', title: '竖线' },
      { tid: 'labelModule.rect', title: '矩形' },
    ]},
  ];
  const $palette = $('#palette').empty();
  groups.forEach(g => {
    $palette.append($('<div class="group-title"></div>').text(g.title));
    if (g.title === '标签字段') {
      $palette.append($('<div id="field-items"></div>'));
      templateFields.forEach(f => $('#field-items').append(fieldPaletteItem(f)));
      return;
    }
    g.items.forEach(item => {
      $palette.append($('<div class="ep-draggable-item"></div>').attr('tid', item.tid).text(item.title));
    });
  });
}

// 画布上字段元素显示其标题（简洁）；具体绑定表达式点击元素后在右侧面板查看。
// testData 只影响设计态显示，保存后的渲染 HTML 始终由占位符数据生成，不受影响
function applyFieldPlaceholders(designJson) {
  ((designJson && designJson.panels) || []).forEach(p => (p.printElements || []).forEach(el => {
    const o = el.options || {};
    if (!o.field) return;
    o.testData = o.title || o.field;
  }));
  return designJson;
}

// 画布上区分元素类型：绑定字段的元素加淡蓝底色（仅设计态，不进渲染产物）
function markFieldElements() {
  const panel = hiprintTemplate && hiprintTemplate.getPanel(0);
  if (!panel) return;
  (panel.printElements || []).forEach(el => {
    if (!el.designTarget) return;
    const bound = !!(el.options && el.options.field);
    el.designTarget.toggleClass('field-bound', bound);
  });
}


// 按元素是否绑定字段裁剪右侧参数面板：
// 固定文本不显示「字段名/测试数据」，字段元素不显示「标题」
// （面板是按 text 类原型共享构建的，在原型上按实例过滤，新拖入的元素同样生效）
function customizeOptionPanels() {
  const panel = hiprintTemplate.getPanel(0);
  // 固定文本：无字段名/测试数据；字段元素：无标题
  // 静态图片：无字段名；二维码（绑定字段的图片）：无图片地址
  const dropRules = {
    text: (hasField) => hasField ? [] : ['field', 'testData'],
    image: (hasField) => hasField ? ['src'] : ['field'],
  };
  Object.entries(dropRules).forEach(([type, dropFor]) => {
    const el = (panel.printElements || []).find(e => e.printElementType && e.printElementType.type === type);
    if (!el) return;
    const proto = Object.getPrototypeOf(el);
    if (proto.__optionPanelPatched) return;
    proto.__optionPanelPatched = true;
    const original = proto.getConfigOptions;
    proto.getConfigOptions = function () {
      const cfg = original.call(this);
      const hasField = !!((this.options && this.options.field) || (this.printElementType && this.printElementType.field));
      const drop = dropFor(hasField);
      return {
        ...cfg,
        tabs: (cfg.tabs || []).map(tab => ({
          ...tab,
          options: (tab.options || []).filter(o => !drop.includes(o.name)),
        })),
      };
    };
  });
}

// 表头组（logo + 公司标题）整体居中：按字体实测文本宽度，logo 与文字固定 8pt 间隔。
// 用 options.role 标记两个元素（role 是普通字符串，随模板 JSON 持久化）；
// 老模板没有 role 标记时回退为「无字段的图片」+「字号最大的固定文本」
function measureTextPt(text, fontSize, fontWeight) {
  if (!measureTextPt.ctx) {
    const canvas = document.createElement('canvas');
    measureTextPt.ctx = canvas.getContext && canvas.getContext('2d');
  }
  const ctx = measureTextPt.ctx;
  if (ctx) {
    ctx.font = (fontWeight || 400) + ' ' + (fontSize * 96 / 72) + 'px "Microsoft YaHei UI", sans-serif';
    return ctx.measureText(text).width * 72 / 96;
  }
  // 无 canvas 环境的估算：CJK ≈ 1em，ASCII ≈ 0.55em
  return [...String(text)].reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? 1 : 0.55), 0) * fontSize;
}

// 表头自动居中开关（localStorage 持久化，默认开）
function autoCenterHeader() {
  return localStorage.getItem('qr_designer_auto_center') !== '0';
}

function centerHeaderGroup(live) {
  if (!autoCenterHeader()) return;
  const panel = hiprintTemplate && hiprintTemplate.getPanel(0);
  if (!panel) return;
  const els = panel.printElements || [];
  const logo = els.find(e => e.options && e.options.role === 'header-logo')
    || els.find(e => e.printElementType && e.printElementType.type === 'image' && !(e.options && e.options.field));
  const title = els.find(e => e.options && e.options.role === 'header-title')
    || els.filter(e => e.printElementType && e.printElementType.type === 'text' && !(e.options && e.options.field) && e.options && e.options.title)
        .sort((a, b) => (b.options.fontSize || 0) - (a.options.fontSize || 0))[0];
  if (!logo || !title) return;
  logo.options.role = 'header-logo';
  title.options.role = 'header-title';
  const panelWPt = (panel.width || 150) * 72 / 25.4;
  const gap = 8;
  const textW = measureTextPt(title.options.title, title.options.fontSize || 17, title.options.fontWeight);
  const logoW = logo.options.width;
  logo.options.left = Math.max(0, (panelWPt - logoW - gap - textW) / 2);
  title.options.left = logo.options.left + logoW + gap;
  title.options.width = textW + 4;
  if (live) {
    logo.updateDesignViewFromOptions();
    title.updateDesignViewFromOptions();
  }
}


function initDesigner(templateJson) {
  hiprint.init({ providers: [new labelProvider()] });
  buildPalette();
  hiprint.PrintElementTypeManager.buildByHtml($('.ep-draggable-item'));
  hiprintTemplate = new hiprint.PrintTemplate({
    template: templateJson,
    settingContainer: '#PrintElementOptionSetting',
    // 图片地址「选择」按钮：打开本地文件选择框，内容转 base64 内嵌进模板
    onImageChooseClick: (target) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => target.refresh(reader.result, false);
        reader.readAsDataURL(file);
      };
      input.click();
    },
  });
  // 8 方向缩放手柄：hiprint 默认只给 s/e/r 三个点；需在 design() 之前打到基类原型上
  (() => {
    const probe = hiprint.PrintElementTypeManager.getElementType('labelModule.text').createPrintElement({});
    let proto = Object.getPrototypeOf(probe);
    while (proto && !Object.prototype.hasOwnProperty.call(proto, 'getReizeableShowPoints')) {
      proto = Object.getPrototypeOf(proto);
    }
    if (proto) {
      proto.getReizeableShowPoints = function () {
        return ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'];
      };
    }
  })();
  $('#design-canvas').empty();
  hiprintTemplate.design('#design-canvas');
  syncPanelSizeInputs();
  customizeOptionPanels();
  markFieldElements();
  // 拖入新类型元素后补一次 patch（初始空白模板没有元素可取原型）
  $('#design-canvas').on('mouseup', () => { customizeOptionPanels(); markFieldElements(); });
  // 字段元素的「字段名/测试数据」只读：绑定关系由底部字段栏统一管理，面板仅查看
  hinnn.event.on(hiprintTemplate.getPrintElementSelectEventKey(), (e) => {
    // 字段元素的 字段名/测试数据/标题（显示名）只读，统一由底部字段栏修改；
    // 固定文本没有这几个参数或标题可编辑（标题即其内容），不受影响
    const el = e && e.printElement;
    const hasField = !!(el && el.options && (el.options.field || (el.printElementType && el.printElementType.field)));
    setTimeout(() => {
      $('#PrintElementOptionSetting .hiprint-option-item').each(function () {
        const label = $(this).find('.hiprint-option-item-label').text().trim();
        const lock = label === '字段名' || label === '测试数据' || (hasField && label === '标题');
        if (lock) {
          $(this).find('input, select, textarea')
            .prop('readonly', true)
            .prop('disabled', true)
            .css({ background: '#f0f0f0', color: '#666', cursor: 'not-allowed' });
        }
      });
    }, 0);
  });
  // 文本编辑提交后实时重新居中表头组
  const firstEl = (hiprintTemplate.getPanel(0).printElements || [])[0];
  if (firstEl && firstEl.templateId) {
    hinnn.event.on('hiprintTemplateDataChanged_' + firstEl.templateId, () => centerHeaderGroup(true));
  }
}

// 拆分访问表达式：{{ 字段 分隔符 [下标] }}（如 {{ qr_string | [6] }}）
// 保存时编译为 Tera 合法变量 {{ _x_qr_string_7c_6 }}，分隔符 UTF-8 字节 hex 编码进变量名，
// 后端渲染时按编码切分请求字段值并取下标
const SPLIT_EXPR_RE = /\{\{\s*([A-Za-z_]\w*)\s+(\S+)\s*\[(\d+)\]\s*\}\}/g;
function encodeSplitExpressions(html) {
  return html.replace(SPLIT_EXPR_RE, (m, field, sep, idx) => {
    const hex = Array.from(new TextEncoder().encode(sep))
      .map(b => b.toString(16).padStart(2, '0')).join('');
    return '{{ _x_' + field + '_' + hex + '_' + idx + ' }}';
  });
}
// C 风格三元 {{ 条件 ? 甲 : 乙 }} 转 Tera 的 Python 风格 {{ 甲 if 条件 else 乙 }}，
// 用户按习惯写法即可（不支持嵌套）
const TERNARY_RE = /\{\{\s*([^{}?:]+?)\s*\?\s*([^{}?:]+?)\s*:\s*([^{}]*?)\s*\}\}/g;
function encodeTernary(html) {
  return html.replace(TERNARY_RE, (m, cond, a, b) =>
    '{{ ' + a.trim() + ' if ' + cond.trim() + ' else ' + b.trim() + ' }}');
}
// 字段转码表达式：{{ 字段@qr }} / {{ 字段@条形码 }}（兼容 @qrcode/@barcode）
// 编译为 {{ _qr_字段 | safe }} / {{ _bar_字段 | safe }}，后端把字段值生成对应图片（<img> 标签），
// 写在文本元素里即可，元素盒子大小即图片大小
const CODE_EXPR_RE = /\{\{\s*([A-Za-z_]\w*)\s*@(qr|qrcode|条形码|barcode)\s*\}\}/g;
function encodeCodeExpressions(html) {
  return html.replace(CODE_EXPR_RE, (m, field, kind) => {
    const prefix = (kind === 'qr' || kind === 'qrcode') ? '_qr_' : '_bar_';
    return '{{ ' + prefix + field + ' | safe }}';
  });
}
// 占位符数据以画布上元素实际使用的字段为准（与字段面板的增删无关）：
// 普通字段生成 {{ field }}；字段名直接写占位符表达式（如 {{ count }}个）的原样输出，由 Tera 替换
function placeholderData(templateJson) {
  const data = { qr_code: '{{ qr_code }}' };
  ((templateJson && templateJson.panels) || []).forEach(p => (p.printElements || []).forEach(el => {
    const f = el.options && el.options.field;
    if (f) data[f] = f.includes('{{') ? f : '{{ ' + f + ' }}';
  }));
  return data;
}

// 预览直接调 /label 走真实渲染链路；请求体即 LabelInfo，用户可自由编辑，
// 上次编辑内容存 localStorage
const PREVIEW_STORAGE_KEY = 'qr_designer_preview_json';
// 常见字段的示例值；未收录的字段用字段名本身作示例
const FIELD_SAMPLES = {
  qr_string: '479927000140|240514A634|ASN240515000367|100|V001|2024-08-21|900001',
  part_no: 'W4515654841155',
  material_no: '479927000140',
  material_name: 'LQFC-0',
  box_no: '900001',
  order_no: 'ASN240515000367',
  count: '100',
  lot_no: '240514A634',
  date: '2024-08-21',
  customer_name: '某某客户有限公司',
  is_return: true,
};

// 按当前模板实际使用的字段生成预览数据：
// 普通字段直接用；表达式（如 {{ qr_string | [0] }}、{{ is_return ? "回" : "" }}）反推其引用的基础字段；
// 二维码元素（qr_code）需要 qr_string
function buildPreviewData() {
  const data = {};
  collectUsedFields().forEach(f => {
    let key = f;
    if (f.includes('{{')) {
      const m = f.match(/([A-Za-z_]\w*)/);
      key = m ? m[1] : null;
    }
    if (key === 'qr_code') key = 'qr_string';
    if (key && !(key in data)) data[key] = key in FIELD_SAMPLES ? FIELD_SAMPLES[key] : key;
  });
  return data;
}

// 提取当前模板实际用到的字段（字段绑定 + 文本内容里的 {{ }} 表达式）
function collectUsedFields() {
  let json = hiprintTemplate.getJson();
  if (typeof json === 'string') json = JSON.parse(json);
  const found = [];
  ((json && json.panels) || []).forEach(p => (p.printElements || []).forEach(el => {
    const o = el.options || {};
    if (o.field && !found.includes(o.field)) found.push(o.field);
    if (o.title) (String(o.title).match(/\{\{[^}]+\}\}/g) || [])
      .forEach(m => { if (!found.includes(m)) found.push(m); });
  }));
  return found;
}

async function renderPreview() {
  const $status = $('#preview-status').css('color', '#c00');
  let label;
  try {
    label = JSON.parse($('#preview-json').val());
  } catch (e) {
    $status.text('JSON 格式错误: ' + e.message);
    return;
  }
  localStorage.setItem(PREVIEW_STORAGE_KEY + '_' + templateId, $('#preview-json').val());
  $status.css('color', '#888').text('渲染中…');
  try {
    // 渲染当前编辑的模板（?template= 指定 id；默认模板无需参数）
    const url = '/label?print=false' + (templateId === 'default' ? '' : '&template=' + encodeURIComponent(templateId));
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify([label]),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + await resp.text());
    const blob = await resp.blob();
    $('#preview-img').attr('src', URL.createObjectURL(blob)).show();
    $status.text('');
  } catch (e) {
    $status.css('color', '#c00').text('渲染失败: ' + e.message);
  }
}

// hiprint 运行时注入到 head 的样式（排除本页面自身的 UI 样式），随模板一起保存，
// 保证 Tera 渲染出的 HTML 脱离 hiprint 也能正常显示。
// 保存的模板只用于展示：剔除设计态规则（拖拽手柄/虚线框/右键菜单/参数面板等）和打印媒体查询
const DESIGN_CSS_RE = /\.design|resize-panel|hicontextmenu|hiprint-option|prop-tab|hi-pretty|hidraggable|hiprint-combo|select2|daterangepicker/;
function collectHiprintCss() {
  const raw = $('head style').not('#designer-ui-style').map((i, el) => el.textContent).get().join('\n');
  const rules = [];
  let depth = 0, start = 0;
  for (let i = 0; i < raw.length; i++) {
    if (raw[i] === '{') depth++;
    else if (raw[i] === '}') {
      depth--;
      if (depth === 0) { rules.push(raw.slice(start, i + 1)); start = i + 1; }
    }
  }
  return rules.filter(rule => {
    const selector = rule.slice(0, rule.indexOf('{')).trim();
    if (selector.startsWith('@media')) return false;
    return !DESIGN_CSS_RE.test(selector);
  }).join('\n');
}

function buildTemplateHtml() {
  // 层叠规则：矩形框置底（zIndex 0），内容元素在上（zIndex 1）。
  // 不能用负数 z-index——会把矩形压到画布背景下面导致边框不可见
  (hiprintTemplate.getPanel(0).printElements || []).forEach(e => {
    e.options.zIndex = (e.printElementType && e.printElementType.type === 'rect') ? 0 : 1;
  });
  centerHeaderGroup(false);
  let json = hiprintTemplate.getJson();
  if (typeof json === 'string') json = JSON.parse(json);
  syncFieldsFromCanvas(json, true);
  json.appPadding = parseFloat($('#app-padding').val()) || 0;
  json.fields = templateFields;
  const $html = hiprintTemplate.getHtml(placeholderData(json));
  const $wrap = $('<div>').append($html);
  // 纯展示模板：去掉可聚焦属性（点击会出现焦点高亮框）和浏览器打印用的 @page 块
  $wrap.find('[tabindex]').removeAttr('tabindex');
  $wrap.find('style[printstyle]').remove();
  const panelHtml = $wrap.html();
  const panel = (json.panels && json.panels[0]) || {};
  // 容器 = 面板尺寸 + 边距，四边间隙一致；超出面板的零散内容裁掉，
  // 纸张层 overflow 已放开，贴边外框线不会被裁。
  // 面板高度贴合内容底部，避免底部出现面板内的死区
  let maxBottom = 0;
  (panel.printElements || []).forEach(el => {
    const o = el.options || {};
    if (typeof o.top === 'number') maxBottom = Math.max(maxBottom, o.top + (o.height || 0));
  });
  if (maxBottom > 0) {
    panel.height = Math.round(maxBottom / 72 * 25.4 * 10) / 10;
    panel.paperFooter = maxBottom;
  }
  const width = panel.width || 150;
  const height = panel.height || 80;
  const doc = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n'
    + '<style>\nhtml, body { margin: 0; padding: 0; }\n'
    + 'body { font-family: "Microsoft YaHei UI", sans-serif; font-weight: bold; }\n'
    + '#app *:focus { outline: none !important; }\n'
    + '.hiprint-printPaper { overflow: visible !important; }\n'
    + '#app { position: relative; width: ' + width + 'mm; height: ' + height + 'mm; overflow: hidden; padding: ' + json.appPadding + 'pt; }\n'
    + '</style>\n<style>\n' + collectHiprintCss() + '\n</style>\n</head>\n<body>\n'
    + '<div id="app">' + panelHtml + '</div>\n</body>\n</html>';
  return { json, html: encodeTernary(encodeCodeExpressions(encodeSplitExpressions(doc))) };
}

$('#btn-save').on('click', async () => {
  try {
    const payload = buildTemplateHtml();
    const resp = await fetch('/api/templates/' + templateId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + await resp.text());
    setStatus('已保存 ' + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus('保存失败: ' + e.message, true);
  }
});

function syncPanelSizeInputs() {
  let json = hiprintTemplate.getJson();
  if (typeof json === 'string') json = JSON.parse(json);
  const p = (json.panels && json.panels[0]) || {};
  $('#panel-w').val(p.width || 150);
  $('#panel-h').val(p.height || 70);
}

$('#btn-panel').on('click', () => {
  const w = parseFloat($('#panel-w').val());
  const h = parseFloat($('#panel-h').val());
  if (!(w > 0 && h > 0)) { setStatus('面板尺寸无效', true); return; }
  // hiprint 面板 resize：paperType 传 null 表示自定义尺寸（单位 mm）
  hiprintTemplate.getPanel(0).resize(null, w, h);
  setStatus('面板已调整为 ' + w + 'mm × ' + h + 'mm，保存后生效');
});
$('#btn-preview').on('click', () => {
  $('#preview-json').val(localStorage.getItem(PREVIEW_STORAGE_KEY + '_' + templateId) || JSON.stringify(buildPreviewData(), null, 2));
  $('#preview-fields').text('当前模板使用字段：' + (collectUsedFields().map(displayFieldName).join('、') || '（无）'));
  $('#preview-mask').fadeIn(100);
  renderPreview();
});
$('#preview-render').on('click', renderPreview);
// JSON 编辑停顿 1 秒后自动重新渲染
let previewTimer = null;
$('#preview-json').on('input', () => {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderPreview, 1000);
});
$('#preview-close').on('click', () => $('#preview-mask').fadeOut(100));
$('#preview-mask').on('click', e => {
  if (e.target.id === 'preview-mask') $('#preview-mask').fadeOut(100);
});

const templateId = new URLSearchParams(location.search).get('id') || 'default';

// 布局偏好：显示面板（左侧字段栏+顶部工具栏）、字段虚线框，均记忆在 localStorage
function applyLayoutPrefs() {
  document.body.classList.toggle('hide-ruler', localStorage.getItem('qr_designer_ruler') === '0');
  document.body.classList.toggle('hide-outline', localStorage.getItem('qr_designer_outline') === '0');
  document.body.classList.toggle('hide-sizebox', localStorage.getItem('qr_designer_sizebox') === '0');
}

$(async () => {
  $('#toggle-ruler')
    .prop('checked', localStorage.getItem('qr_designer_ruler') !== '0')
    .on('change', function () { localStorage.setItem('qr_designer_ruler', this.checked ? '1' : '0'); applyLayoutPrefs(); });
  $('#toggle-sizebox')
    .prop('checked', localStorage.getItem('qr_designer_sizebox') !== '0')
    .on('change', function () { localStorage.setItem('qr_designer_sizebox', this.checked ? '1' : '0'); applyLayoutPrefs(); });
  $('#toggle-outline')
    .prop('checked', localStorage.getItem('qr_designer_outline') !== '0')
    .on('change', function () { localStorage.setItem('qr_designer_outline', this.checked ? '1' : '0'); applyLayoutPrefs(); });
  applyLayoutPrefs();
  $('#hint-toggle').on('click', (e) => { e.stopPropagation(); $('#hint-pop').toggle(); });
  $(document).on('click', (e) => { if (!$(e.target).closest('#hint-pop, #hint-toggle').length) $('#hint-pop').hide(); });
  $('#btn-field-save').on('click', submitFieldEditor);
  $('#btn-field-cancel').on('click', resetFieldEditor);
  $('#auto-center-header')
    .prop('checked', autoCenterHeader())
    .on('change', function () { localStorage.setItem('qr_designer_auto_center', this.checked ? '1' : '0'); });
  try {
    const resp = await fetch('/api/templates/' + templateId);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const record = await resp.json();
    $('#tpl-name').text('— ' + record.name + (record.is_default ? '（默认）' : ''));
    if (Array.isArray(record.design_json.fields) && record.design_json.fields.length) {
      templateFields = record.design_json.fields;
    } else {
      // 新模板（未保存过）：不预置默认字段，只给一个演示字段，其余按需自行添加
      templateFields = [{ name: 'part_no', title: '零件号' }];
    }
    // 画布上用到但字段列表没有的绑定，并入字段列表（保持两边一致）
    syncFieldsFromCanvas(record.design_json, false);
    $('#app-padding').val(record.design_json.appPadding ?? 3);
    initDesigner(applyFieldPlaceholders(record.design_json));
    setStatus('已加载模板');
  } catch (e) {
    initDesigner({ panels: [{ index: 0, width: 150, height: 70, paperHeader: 0, paperFooter: 198.4, paperNumberDisabled: true, printElements: [] }] });
    setStatus('模板加载失败，从空白标签开始', true);
  }
});
</script>
