<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打印代理管理</title>
<style>
  body { margin: 0; font-family: "Microsoft YaHei UI", sans-serif; background: #f0f2f5; color: #1f2937; }
  #toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: #2d3a4a; color: #fff; }
  #toolbar h1 { margin: 0; font-size: 18px; }
  #toolbar button, #toolbar a { padding: 7px 14px; border: 0; border-radius: 4px; background: #4a90d9; color: #fff; text-decoration: none; cursor: pointer; }
  #toolbar button:hover, #toolbar a:hover { background: #357ab8; }
  #summary { margin-left: auto; font-size: 13px; }
  #content { padding: 20px; }
  .card { background: #fff; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.1); overflow: hidden; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 12px 16px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
  th { background: #fafafa; color: #4b5563; }
  .online { display: inline-block; padding: 3px 10px; border-radius: 12px; background: #52c41a; color: #fff; font-size: 12px; }
  .override { color: #d46b08; }
  .muted { color: #9ca3af; }
  .actions button { margin-right: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; border: 1px solid #d0d0d0; border-radius: 4px; background: #fff; }
  .actions button:hover { border-color: #4a90d9; color: #4a90d9; }
  .empty, .error { padding: 36px; text-align: center; color: #6b7280; }
  .error { color: #cf1322; }
</style>
</head>
<body>
<div id="toolbar">
  <h1>打印代理管理</h1>
  <button id="refresh" type="button">刷新</button>
  <a href="/templates">模板管理</a>
  <span id="summary">正在加载...</span>
</div>
<div id="content"><div class="card" id="result"></div></div>
<script>
function formatDuration(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), r = s % 60, p = [];
  if (d) p.push(d + ' 天');
  if (h) p.push(h + ' 小时');
  if (m) p.push(m + ' 分钟');
  if (!p.length || r) p.push(r + ' 秒');
  return p.join(' ');
}

function printerText(agent) {
  return agent.printer_override || '代理本地配置';
}

function paperText(agent) {
  if (agent.paper_width == null && agent.paper_height == null) return '服务器默认';
  const w = agent.paper_width == null ? '默认' : agent.paper_width;
  const h = agent.paper_height == null ? '默认' : agent.paper_height;
  return w + ' x ' + h;
}

async function api(method, url, body) {
  const resp = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + await resp.text());
}

async function editSettings(agent) {
  const printer = prompt('打印机名（留空 = 使用代理本地配置）：', agent.printer_override || '');
  if (printer === null) return;
  const width = prompt('纸张宽度 cm（留空 = 服务器默认 ' + '）：', agent.paper_width ?? '');
  if (width === null) return;
  const height = prompt('纸张高度 cm（留空 = 服务器默认）：', agent.paper_height ?? '');
  if (height === null) return;
  await api('PUT', '/api/agents/' + encodeURIComponent(agent.station) + '/settings', {
    printer: printer.trim() || null,
    paper_width: width.trim() ? parseFloat(width) : null,
    paper_height: height.trim() ? parseFloat(height) : null,
  });
  await loadAgents();
}

async function clearSettings(agent) {
  if (!confirm('清除工位「' + agent.station + '」的打印设置覆盖？')) return;
  await api('DELETE', '/api/agents/' + encodeURIComponent(agent.station) + '/settings');
  await loadAgents();
}

async function loadAgents() {
  const summary = document.querySelector('#summary');
  const result = document.querySelector('#result');
  summary.textContent = '正在加载...';
  try {
    const response = await fetch('/api/agents', { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const agents = await response.json();
    agents.sort((a, b) => a.station.localeCompare(b.station));
    summary.textContent = '在线代理：' + agents.length;
    if (!agents.length) {
      result.innerHTML = '<div class="empty">当前没有打印代理接入</div>';
      return;
    }
    result.innerHTML = '<table><thead><tr><th>工位</th><th>IP 地址</th><th>MAC 地址</th><th>打印机</th><th>纸张(cm)</th><th>状态</th><th>已连接</th><th>操作</th></tr></thead><tbody></tbody></table>';
    const tbody = result.querySelector('tbody');
    for (const agent of agents) {
      const row = document.createElement('tr');
      const hasOverride = agent.printer_override != null || agent.paper_width != null || agent.paper_height != null;
      const cells = [agent.station, agent.ip || '-', agent.mac || '-', printerText(agent), paperText(agent)];
      for (let i = 0; i < cells.length; i++) {
        const td = document.createElement('td');
        td.textContent = cells[i];
        if (i >= 3) td.className = hasOverride ? 'override' : 'muted';
        row.appendChild(td);
      }
      const status = document.createElement('td');
      status.innerHTML = '<span class="online">在线</span>';
      row.appendChild(status);
      const connected = document.createElement('td');
      connected.textContent = formatDuration(agent.connected_secs);
      row.appendChild(connected);
      const actions = document.createElement('td');
      actions.className = 'actions';
      const btnEdit = document.createElement('button');
      btnEdit.textContent = '设置';
      btnEdit.onclick = () => editSettings(agent).catch(e => alert('设置失败: ' + e.message));
      actions.appendChild(btnEdit);
      if (hasOverride) {
        const btnClear = document.createElement('button');
        btnClear.textContent = '清除';
        btnClear.onclick = () => clearSettings(agent).catch(e => alert('清除失败: ' + e.message));
        actions.appendChild(btnClear);
      }
      row.appendChild(actions);
      tbody.appendChild(row);
    }
  } catch (error) {
    summary.textContent = '加载失败';
    result.innerHTML = '<div class="error">无法加载代理列表：' + error.message + '</div>';
  }
}

document.querySelector('#refresh').addEventListener('click', loadAgents);
loadAgents();
setInterval(loadAgents, 10000);
</script>
</body>
</html>
