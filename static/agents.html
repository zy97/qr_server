<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打印代理管理</title>
<style>
  body { margin: 0; font-family: "Microsoft YaHei UI", sans-serif; background: #f0f2f5; color: #1f2937; }
  #toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: #2d3a4a; color: #fff; }
  #toolbar h1 { margin: 0; font-size: 18px; }
  #toolbar button, #toolbar a { padding: 7px 14px; border: 0; border-radius: 4px; background: #4a90d9; color: #fff; text-decoration: none; cursor: pointer; }
  #toolbar button:hover, #toolbar a:hover { background: #357ab8; }
  #summary { margin-left: auto; font-size: 13px; }
  #content { padding: 20px; }
  .card { background: #fff; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.1); overflow: hidden; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 12px 16px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
  th { background: #fafafa; color: #4b5563; }
  .online { display: inline-block; padding: 3px 10px; border-radius: 12px; background: #52c41a; color: #fff; font-size: 12px; }
  .override { color: #d46b08; }
  .muted { color: #9ca3af; }
  .actions button { margin-right: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; border: 1px solid #d0d0d0; border-radius: 4px; background: #fff; }
  .actions button:hover { border-color: #4a90d9; color: #4a90d9; }
  .empty, .error { padding: 36px; text-align: center; color: #6b7280; }
  .error { color: #cf1322; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
  #modal[hidden] { display: none; }
  .dialog { background: #fff; border-radius: 6px; padding: 20px 24px; width: 360px; }
  .dialog h3 { margin: 0 0 14px; font-size: 16px; }
  .dialog label { display: block; margin: 10px 0 4px; font-size: 13px; color: #4b5563; }
  .dialog select, .dialog input { width: 100%; padding: 7px 10px; border: 1px solid #d0d0d0; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
  .dialog-actions { margin-top: 18px; text-align: right; }
  .dialog-actions button { padding: 7px 18px; border: 0; border-radius: 4px; cursor: pointer; font-size: 14px; }
  #m-save { background: #4a90d9; color: #fff; margin-right: 8px; }
  #m-cancel { background: #f0f0f0; }
</style>
</head>
<body>
<div id="toolbar">
  <h1>打印代理管理</h1>
  <button id="refresh" type="button">刷新</button>
  <a href="/templates">模板管理</a>
  <span id="summary">正在加载...</span>
</div>
<div id="content"><div class="card" id="result"></div></div>
<div id="modal" hidden>
  <div class="dialog">
    <h3 id="m-title"></h3>
    <label for="m-printer">打印机（不选 = 使用代理本地配置）</label>
    <select id="m-printer"></select>
    <label for="m-width">纸张宽度 cm（留空 = 服务器默认）</label>
    <input id="m-width" type="number" step="0.01" min="0">
    <label for="m-height">纸张高度 cm（留空 = 服务器默认）</label>
    <input id="m-height" type="number" step="0.01" min="0">
    <div class="dialog-actions">
      <button id="m-save" type="button">保存</button>
      <button id="m-cancel" type="button">取消</button>
    </div>
  </div>
</div>
<script>
function formatDuration(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), r = s % 60, p = [];
  if (d) p.push(d + ' 天');
  if (h) p.push(h + ' 小时');
  if (m) p.push(m + ' 分钟');
  if (!p.length || r) p.push(r + ' 秒');
  return p.join(' ');
}

function printerText(agent) {
  return agent.printer_override || '代理本地配置';
}

function paperText(agent) {
  if (agent.paper_width == null && agent.paper_height == null) return '服务器默认';
  const w = agent.paper_width == null ? '默认' : agent.paper_width;
  const h = agent.paper_height == null ? '默认' : agent.paper_height;
  return w + ' x ' + h;
}

async function api(method, url, body) {
  const resp = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + await resp.text());
}

let editing = null;

function openSettings(agent) {
  editing = agent;
  document.querySelector('#m-title').textContent = '设置工位「' + agent.station + '」';
  const select = document.querySelector('#m-printer');
  select.innerHTML = '';
  const empty = document.createElement('option');
  empty.value = '';
  empty.textContent = '（使用代理本地配置）';
  select.appendChild(empty);
  const printers = agent.printers || [];
  for (const name of printers) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  }
  if (agent.printer_override && !printers.includes(agent.printer_override)) {
    const opt = document.createElement('option');
    opt.value = agent.printer_override;
    opt.textContent = agent.printer_override + '（不在该代理当前打印机列表中）';
    select.appendChild(opt);
  }
  select.value = agent.printer_override || '';
  document.querySelector('#m-width').value = agent.paper_width ?? '';
  document.querySelector('#m-height').value = agent.paper_height ?? '';
  document.querySelector('#modal').hidden = false;
}

function closeSettings() {
  editing = null;
  document.querySelector('#modal').hidden = true;
}

document.querySelector('#m-cancel').addEventListener('click', closeSettings);
document.querySelector('#m-save').addEventListener('click', async () => {
  if (!editing) return;
  const station = editing.station;
  const printer = document.querySelector('#m-printer').value;
  const width = document.querySelector('#m-width').value.trim();
  const height = document.querySelector('#m-height').value.trim();
  try {
    await api('PUT', '/api/agents/' + encodeURIComponent(station) + '/settings', {
      printer: printer || null,
      paper_width: width ? parseFloat(width) : null,
      paper_height: height ? parseFloat(height) : null,
    });
    closeSettings();
    await loadAgents();
  } catch (e) {
    alert('保存失败: ' + e.message);
  }
});

async function clearSettings(agent) {
  if (!confirm('清除工位「' + agent.station + '」的打印设置覆盖？')) return;
  try {
    await api('DELETE', '/api/agents/' + encodeURIComponent(agent.station) + '/settings');
    await loadAgents();
  } catch (e) {
    alert('清除失败: ' + e.message);
  }
}

async function loadAgents() {
  const summary = document.querySelector('#summary');
  const result = document.querySelector('#result');
  summary.textContent = '正在加载...';
  try {
    const response = await fetch('/api/agents', { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const agents = await response.json();
    agents.sort((a, b) => a.station.localeCompare(b.station));
    summary.textContent = '在线代理：' + agents.length;
    if (!agents.length) {
      result.innerHTML = '<div class="empty">当前没有打印代理接入</div>';
      return;
    }
    result.innerHTML = '<table><thead><tr><th>工位</th><th>IP 地址</th><th>MAC 地址</th><th>打印机</th><th>纸张(cm)</th><th>状态</th><th>已连接</th><th>操作</th></tr></thead><tbody></tbody></table>';
    const tbody = result.querySelector('tbody');
    for (const agent of agents) {
      const row = document.createElement('tr');
      const hasOverride = agent.printer_override != null || agent.paper_width != null || agent.paper_height != null;
      const cells = [agent.station, agent.ip || '-', agent.mac || '-', printerText(agent), paperText(agent)];
      for (let i = 0; i < cells.length; i++) {
        const td = document.createElement('td');
        td.textContent = cells[i];
        if (i >= 3) td.className = hasOverride ? 'override' : 'muted';
        row.appendChild(td);
      }
      const status = document.createElement('td');
      status.innerHTML = '<span class="online">在线</span>';
      row.appendChild(status);
      const connected = document.createElement('td');
      connected.textContent = formatDuration(agent.connected_secs);
      row.appendChild(connected);
      const actions = document.createElement('td');
      actions.className = 'actions';
      const btnEdit = document.createElement('button');
      btnEdit.textContent = '设置';
      btnEdit.onclick = () => openSettings(agent);
      actions.appendChild(btnEdit);
      if (hasOverride) {
        const btnClear = document.createElement('button');
        btnClear.textContent = '清除';
        btnClear.onclick = () => clearSettings(agent);
        actions.appendChild(btnClear);
      }
      row.appendChild(actions);
      tbody.appendChild(row);
    }
  } catch (error) {
    summary.textContent = '加载失败';
    result.innerHTML = '<div class="error">无法加载代理列表：' + error.message + '</div>';
  }
}

document.querySelector('#refresh').addEventListener('click', loadAgents);
loadAgents();
setInterval(loadAgents, 10000);
</script>
</body>
</html>
