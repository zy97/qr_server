<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打印代理管理</title>
<style>
body{margin:0;font-family:"Microsoft YaHei UI",sans-serif;background:#f0f2f5;color:#1f2937}#toolbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#2d3a4a;color:#fff}#toolbar h1{margin:0;font-size:18px}#toolbar button,#toolbar a{padding:7px 14px;border:0;border-radius:4px;background:#4a90d9;color:#fff;text-decoration:none;cursor:pointer}#summary{margin-left:auto;font-size:13px}#content{padding:20px}.card{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.1);overflow:hidden}table{border-collapse:collapse;width:100%}th,td{padding:12px 16px;border-bottom:1px solid #eee;text-align:left;font-size:14px}th{background:#fafafa}.online{display:inline-block;padding:3px 10px;border-radius:12px;background:#52c41a;color:#fff;font-size:12px}.empty,.error{padding:36px;text-align:center;color:#6b7280}.error{color:#cf1322}
</style>
</head>
<body>
<div id="toolbar"><h1>打印代理管理</h1><button id="refresh">刷新</button><a href="/templates">模板管理</a><span id="summary">正在加载...</span></div>
<div id="content"><div class="card" id="result"></div></div>
<script>
function duration(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),r=s%60,p=[];if(d)p.push(d+' 天');if(h)p.push(h+' 小时');if(m)p.push(m+' 分钟');if(!p.length||r)p.push(r+' 秒');return p.join(' ')}
async function loadAgents(){const summary=document.querySelector('#summary'),result=document.querySelector('#result');summary.textContent='正在加载...';try{const response=await fetch('/api/agents',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const agents=await response.json();agents.sort((a,b)=>a.station.localeCompare(b.station));summary.textContent='在线代理：'+agents.length;if(!agents.length){result.innerHTML='<div class="empty">当前没有打印代理接入</div>';return}result.innerHTML='<table><thead><tr><th>工位</th><th>IP 地址</th><th>MAC 地址</th><th>状态</th><th>已连接</th></tr></thead><tbody></tbody></table>';const tbody=result.querySelector('tbody');for(const agent of agents){const row=document.createElement('tr'),station=document.createElement('td'),ip=document.createElement('td'),mac=document.createElement('td'),status=document.createElement('td'),connected=document.createElement('td');station.textContent=agent.station;ip.textContent=agent.ip||'-';mac.textContent=agent.mac||'-';status.innerHTML='<span class="online">在线</span>';connected.textContent=duration(agent.connected_secs);row.append(station,ip,mac,status,connected);tbody.appendChild(row)}}catch(error){summary.textContent='加载失败';result.innerHTML='<div class="error">无法加载代理列表：'+error.message+'</div>'}}
document.querySelector('#refresh').addEventListener('click',loadAgents);loadAgents();setInterval(loadAgents,10000);
</script>
</body>
</html>
