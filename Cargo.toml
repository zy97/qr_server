[package]
edition = "2021"
name = "qr_service"
version = "0.1.0"

[features]
default = ["chrome"]
master = [
    "dep:anyhow",
    "dep:base64",
    "dep:headless_chrome",
    "dep:image",
    "dep:qrcode",
    "dep:tera",
]
typst = [
    "dep:actix-files",
    "dep:serde_json",
]
chrome = [
    "dep:anyhow",
    "dep:base64",
    "dep:headless_chrome",
    "dep:image",
    "dep:qrcode",
    "dep:tera",
]
agent-browser = [
    "dep:actix-files",
    "dep:base64",
    "dep:image",
    "dep:qrcode",
    "dep:tera",
]
[dependencies]
serde_json = { version = "1.0", optional = true }
actix-files = { version = "0.6", optional = true }
actix-web = "4"
anyhow = { version = "1", optional = true }
headless_chrome = { version = "1.0.22", features = [
    "fetch",
], optional = true }
image = { version = "0.25", optional = true }
qrcode = { version = "0.14.1", optional = true }
serde = { version = "1", features = ["derive"] }
tera = { version = "2.1.0", default-features = false, optional = true }
thiserror = "2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
base64 = { version = "0.23.1", optional = true } # 用于将图像转换为 Base64
[dev-dependencies]
criterion = "0.8.2"

[[bench]]
harness = false
name = "qr_benchmark"
