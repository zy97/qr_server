[package]
edition = "2021"
name = "qr_service"
version = "0.1.0"

[features]
default = ["typst"]
master = [
    "dep:actix-files",
    "dep:anyhow",
    "dep:barcoders",
    "dep:base64",
    "dep:headless_chrome",
    "dep:image",
    "dep:qrcode",
    "dep:tera",
]
typst = [
    "dep:actix-files",
    "dep:serde_json",
]
chrome = [
    "dep:actix-files",
    "dep:anyhow",
    "dep:barcoders",
    "dep:base64",
    "dep:headless_chrome",
    "dep:image",
    "dep:named_pipe",
    "dep:qrcode",
    "dep:serde_json",
    "dep:tera",
]

[dependencies]
serde_json = { version = "1.0", optional = true }
actix-files = { version = "0.6", optional = true }
actix-web = "4"
anyhow = { version = "1.0.94", optional = true }
barcoders = { version = "2.0.0", features = ["image"], optional = true }
headless_chrome = { version = "1.0.22", features = [
    "fetch",
], optional = true }
image = { version = "0.25", optional = true }
qrcode = { version = "0.14.1", optional = true }
serde = { version = "1.0.216", features = ["derive"] }
tera = { version = "1", default-features = false, optional = true }
thiserror = "2.0.6"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.19"
base64 = { version = "0.22.1", optional = true } # 用于将图像转换为 Base64
named_pipe = { version = "0.4.1", optional = true }
# chromiumoxide = "0.7.0"
# snafu = "0.8.5" #定义的错误只能在同级或子级下使用，

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
harness = false
name = "qr_benchmark"
