<style>


.horLine {
  position: absolute;
  border: 0;
  border-top: 1px solid rgb(241, 110, 110);
}

.verLine {
  position: absolute;
  border: 0;
  border-left: 1px solid rgb(241, 110, 110);
}


/* 拖拽时元素辅助线 */
.toplineOfPosition, .bottomlineOfPosition {
  border: 0;
  border-top: 1px dashed  rgb(169, 169, 169);
}

.leftlineOfPosition, .rightlineOfPosition {
  border: 0;
  border-left: 1px dashed  rgb(169, 169, 169);
}


/* 拖拽时的坐标位置 */
.topPosition {
  background: red;
  color: white;
  border-radius: 20rem;
  min-width: 10px;
  padding: 0 2px;
  font-size: 12px;
  line-height: normal;
  z-index: 9;
}

.topPosition-lineMode {
  color: red;
  background: unset;
  line-height: normal;
  z-index: 9;
}

.leftPosition {
  background: red;
  color: white;
  border-radius: 20rem;
  min-width: 10px;
  padding: 0 2px;
  font-size: 12px;
  line-height: normal;
  z-index: 9;
}

.leftPosition-lineMode {
  color: red;
  background: unset;
  line-height: normal;
  z-index: 9;
}


/* 元素始终隐藏 */
.alwaysHide {
  background-color: gray !important;
}


/* hiprint-pagination */
.hiprint-pagination {
    display: inline-block;
    padding-left: 0;
}

    .hiprint-pagination > li {
        border: 1px solid #bdc3c7;
        -moz-border-radius: 2px;
        -webkit-border-radius: 2px;
        display: block;
        float: left;
        padding: 5px;
        text-decoration: none;
        margin-right: 5px;
        margin-bottom: 5px;
        font-family: helvetica;
        font-size: 13px;
        cursor: pointer
    }


        .hiprint-pagination > li > span {
            padding: 0 10px 0 10px;
        }


        .hiprint-pagination > li > a {
            color: #bdc3c7;
            font-weight: bold;
            text-decoration: none;
            font-size: 11px;
            padding: 3px;
        }


            .hiprint-pagination > li > a:hover {
                color: red;
            }


.hiprint-pagination .selected {
  border: #2196f3 1px solid;
}



.hiprint-pagination-sm > li > a {
    padding: 5px 10px;
    font-size: 12px;
    line-height: 1.5;
}

/*rect-printElement-type hiprint-printElement-type */
.rect-printElement-types .hiprint-printElement-type {
    display: block;
}


.rect-printElement-types .hiprint-printElement-type {
    padding: 0 0 0 0;
    list-style: none;
}


    .rect-printElement-types .hiprint-printElement-type > li > .title {
        display: block;
        padding: 4px 0px;
        clear: both;
    }


    .rect-printElement-types .hiprint-printElement-type > li > ul {
        padding: 0 0 0 0;
        display: block;
        list-style: none;
    }


        .rect-printElement-types .hiprint-printElement-type > li > ul > li {
            display: block;
            width: 50%;
            float: left;
            max-width: 100px;
        }


            .rect-printElement-types .hiprint-printElement-type > li > ul > li > a {
                height: 92px;
                padding: 12px 6px;
                margin-left: -1px;
                line-height: 1.42857143;
                color: #337ab7;
                text-decoration: none;
                background-color: #fff;
                border: 1px solid #ddd;
                margin-right: 5px;
                width: 95%;
                max-width: 100px;
                display: inline-block;
                text-align: center;
                margin-bottom: 7px;
                box-sizing: border-box;
                color: #b9a5a6;
                border: 1px solid rgba(0,0,0,0.2);
                border-radius: 3px;
                box-shadow: 0 1px 0 0 rgba(0,0,0,0.15);
            }



/*small-printElement-type hiprint-printElement-type */
.small-printElement-types .hiprint-printElement-type {
    display: block;
}


.small-printElement-types .hiprint-printElement-type {
    padding: 0 0 0 0;

}

    }

        padding: 0 0 0 0;
        display: block;
        list-style: none;
        width: 100%;
    }


        .small-printElement-types .hiprint-printElement-type > li > ul > li {
            display: block;
            width: 50%;
            float: left;
            padding: 0 4px;
        }


            .small-printElement-types .hiprint-printElement-type > li > ul > li > a {
                height: 22px;

.hiprint-toolbar {
}


    .hiprint-toolbar > ul {

font-weight: normal;*/

/*hitable reizer*/
.hitable {
}




    .hitable .selected {
        background: #3e66ad;
    }



    /*resizer*/
    .hitable tr.resizerRow,
    .hitable .resizerRow td {
        border: 0pt dashed;
        height: 0pt;
        background: #fff;
    }


        .hitable tr.resizerRow + tr,
        .hitable tr.resizerRow + tr td {
            border-top: 0px !important;
        }


    .hitable td.resizerColumn {
        border: 0pt dashed;
        width: 0.000001px !important;
        background: #fff;
    }



        .hitable td.resizerColumn + td {
            border-left: 0px !important;
        }



/*GRIP*/

.columngrips {
    height: 0px;
    position: absolute;
}


.columngrip {
    margin-left: -5px;
    position: absolute;
    z-index: 5;
    width: 10px;
}


    .columngrip .gripResizer {
        position: absolute;
        filter: alpha(opacity=1);
        opacity: 0;
        width: 10px;
        height: 100%;
        cursor: col-resize;
        top: 0px;
    }


.columngripDraging {
    border-left: 1px dotted black;
}


.rowgrips {
    height: 0px;
    width: 0px;
    position: absolute;
}


.rowgrip {
    margin-top: -5px;
    position: absolute;
    z-index: 5;
    height: 10px;
}


    .rowgrip .gripResizer {
        position: absolute;
        filter: alpha(opacity=1);
        opacity: 0;
        height: 10px;
        width: 100%;
        cursor: row-resize;
        left: 0px;
    }


.rowgripDraging {
    border-top: 1px dotted black;
}


.hitable .hitable-editor-text {
    border: 1px solid;
    width: 95%;
    height: 80%;
}





.hipanel-disable {
    height: 0px;
    display: block !important;
    top: 8500px;
    width: 0px;
    overflow: hidden;
    position: absolute;
}


.hiprint_rul_wrapper {
    position: absolute;
    height: 100%;
    width: 100%;
    overflow: hidden;
    pointer-events: none;
    border: 0;
    border-top: 1px solid rgb(201, 190, 190);
    border-left: 1px solid rgb(201, 190, 190);
    padding-left: 15px;
	padding-top:15px;
    margin: -16px;
	box-sizing: content-box!important;
}


    .hiprint_rul_wrapper .h_img {
        position: absolute;
        top: 0px;
        left: 15px;
        width: 400mm;
        height: 15px;
        max-width: none;
    }


    .hiprint_rul_wrapper .v_img {
        width: 400mm;
        max-width: none;
        transform: rotate(90deg);
        transform-origin: 0 100%;
        height: 15px;
        position: absolute;
        top: -2px;
        left: 0px;
    }
