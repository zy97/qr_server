[package]
name = "print-agent"
version = "0.5.0"
edition = "2021"
description = "标签打印代理：接收 PNG 并发送到本机 Windows 打印机"
repository = "https://github.com/zy97/qr_server"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["json", "tokio", "tracing"] }
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["registry", "std"] }
serde_json = "1.0"
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] } # 内网纯 ws://，不需要 TLS
tower-http = { version = "0.6", features = ["cors"] } # 浏览器跨域调本机 agent

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

# 打印代理只部署 Windows，发布只构建 Windows 包（package-local，覆盖 dist-workspace.toml 的全局 targets）
[package.metadata.dist]
targets = ["x86_64-pc-windows-msvc"]
